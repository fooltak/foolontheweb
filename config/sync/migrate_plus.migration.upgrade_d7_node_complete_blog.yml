uuid: eb96cbee-493a-4e39-abb1-8082f894fdbd
langcode: ja
status: true
dependencies: {  }
id: upgrade_d7_node_complete_blog
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (ブログエントリ)'
source:
  plugin: d7_node_complete
  node_type: blog
process:
  nid:
    -
      plugin: get
      source: tnid
  vid:
    -
      plugin: get
      source: vid
  langcode:
    -
      plugin: default_value
      source: language
      default_value: und
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_blog/0/status:
    -
      plugin: get
      source: comment
  taxonomy_vocabulary_1:
    -
      plugin: sub_process
      source: taxonomy_vocabulary_1
      process:
        target_id: tid
  body:
    -
      plugin: get
      source: body
  field_images:
    -
      plugin: sub_process
      source: field_images
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
  field_classification:
    -
      plugin: get
      source: field_classification
  field_no_insert:
    -
      plugin: get
      source: field_no_insert
  field_add_text:
    -
      plugin: get
      source: field_add_text
  field_images2:
    -
      plugin: sub_process
      source: field_images2
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
  field_jplayer:
    -
      plugin: sub_process
      source: field_jplayer
      process:
        target_id: fid
        display: display
        description: description
  field_audio:
    -
      plugin: sub_process
      source: field_audio
      process:
        target_id: fid
        display: display
        description: description
  field_tag2:
    -
      plugin: sub_process
      source: field_tag2
      process:
        target_id: tid
  field_latlng:
    -
      plugin: sub_process
      source: field_latlng
      process:
        target_id:
          -
            plugin: paragraphs_lookup
            tags: 'Field Collection Content'
            source: value
          -
            plugin: extract
            index:
              - id
        target_revision_id:
          -
            plugin: paragraphs_lookup
            tags:
              - 'Field Collection Revisions Content'
              - 'Field Collection Content'
            tag_ids:
              'Field Collection Revisions Content':
                - revision_id
              'Field Collection Content':
                - value
          -
            plugin: extract
            index:
              - revision_id
  field_audio2:
    -
      plugin: sub_process
      source: field_audio2
      process:
        target_id: fid
        display: display
        description: description
  field_metatag:
    -
      plugin: d7_metatag_entities
      source: pseudo_metatag_entities
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: blog
migration_dependencies:
  required:
    - upgrade_d7_user
    - upgrade_d7_node_type
    - upgrade_language
    - upgrade_d7_field_collection_latlng
    - upgrade_d7_field_collection_revisions_latlng
  optional:
    - upgrade_d7_field_instance
    - upgrade_d7_comment_field_instance
    - upgrade_d7_metatag_field_node
    - upgrade_d7_metatag_field_instance_node_blog
    - upgrade_d7_metatag_field_instance_widget_settings_node_blog
